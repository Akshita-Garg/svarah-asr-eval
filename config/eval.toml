# VoiceRefine Svarah evaluation configuration.
#
# This file IS part of the experiment definition and is committed to Git. It
# pins the dataset revision and records the exact runtime configuration of each
# backend (mirroring VoiceRefine Desktop). Changing any of these values changes
# the cache keys and the run manifest, so runs stay reproducible and comparable.
#
# Local model/binary paths default to the sibling VoiceRefine Desktop project.
# They are resolved relative to the repo root and can be overridden per-machine
# with the same environment variables the desktop app uses (see each backend).

[dataset]
name = "ai4bharat/Svarah"
split = "test"
# Pinned at probe time (2026-08-10). The manifest records this so later runs
# recover the exact subset from this revision.
revision = "ebbf7777fe771490696a3f7b007097606fa8c924"
seed = 42
subset_size = 200
debug_subset_size = 20

# Which backends are active. A backend listed here that is missing its model,
# binary, or key skips cleanly without blocking the others (DESIGN: graceful
# degradation).
[backends]
active = [
    "crisp_v0823_whisper_base_en_q4k",
    "crisp_v0823_parakeet_q4k",
    "crisp_v0823_cohere_q4k",
]

# --- Local default: VoiceRefine's lightweight alternative -------------------
[backends.voicerefine_whisper_tiny_int8]
type = "whisper_sherpa"
# Env override: VOICEREFINE_SHERPA_MODEL_DIR
model_dir = "../voicerefine-desktop/resources/models/sherpa-onnx-whisper-tiny.en"
precision = "int8"           # int8 | fp32 ; VOICEREFINE_SHERPA_PRECISION
num_threads = 4              # VOICEREFINE_SHERPA_THREADS
language = "en"
task = "transcribe"
decoding_method = "greedy_search"
tail_paddings = -1
provider = "cpu"

# --- Local default: VoiceRefine's shipping default model --------------------
[backends.voicerefine_parakeet_q4]
type = "crispasr_server"
# Env override: VOICEREFINE_CRISPASR_BIN
bin = "../voicerefine-desktop/resources/bin/crispasr-windows-x86_64-cpu/crispasr-windows-x86_64-cpu/crispasr.exe"
# Env override: VOICEREFINE_CRISPASR_PARAKEET_MODEL
model = "../voicerefine-desktop/resources/models/parakeet-tdt-0.6b-v3-GGUF/parakeet-tdt-0.6b-v3-q4_k.gguf"
backend = "parakeet"
language = "en"
threads = 8                  # VOICEREFINE_CRISPASR_THREADS
gpu_backend = "cpu"
quantization = "q4_k"
host = "127.0.0.1"
port = 51234                 # VOICEREFINE_CRISPASR_PORT
start_timeout_ms = 15000     # VOICEREFINE_CRISPASR_START_TIMEOUT_MS
request_timeout_ms = 180000  # VOICEREFINE_CRISPASR_TIMEOUT_MS

# --- Controlled local comparison: same CrispASR server and resources --------
[backends.controlled_whisper_tiny_q4_0]
type = "crispasr_server"
bin = "../voicerefine-desktop/resources/bin/crispasr-windows-x86_64-cpu/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "models/whisper-tiny.en-GGML/ggml-tiny.en-q4_0.bin"
backend = "whisper"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_0"
no_punctuation = true
host = "127.0.0.1"
port = 51234
start_timeout_ms = 15000
request_timeout_ms = 180000

[backends.controlled_cohere_q4]
type = "crispasr_server"
bin = "../voicerefine-desktop/resources/bin/crispasr-windows-x86_64-cpu/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "../voicerefine-desktop/resources/models/cohere-transcribe-03-2026-GGUF/cohere-transcribe-q4_k.gguf"
backend = "cohere"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_k"
no_punctuation = true
host = "127.0.0.1"
port = 51234
start_timeout_ms = 15000
request_timeout_ms = 180000

# --- Controlled Q4_K comparison: CrispASR v0.8.23, CPU, 8 threads ----------
# Whisper Tiny cannot be encoded as a valid legacy Q4_K model because its
# width (384) is not divisible by the Q4_K block size (256). Base English is
# the smallest standard Whisper model that satisfies the format constraint.
[backends.crisp_v0823_whisper_base_en_q4k]
type = "crispasr_server"
bin = "models/crispasr-v0.8.23/runtime/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "models/whisper-base.en-GGML/ggml-base.en-q4_k.bin"
backend = "whisper"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_k"
no_punctuation = false       # Whisper supplies native punctuation in v0.8.23.
runtime_version = "0.8.23"
runtime_git_sha = "7d22deec"
host = "127.0.0.1"
port = 51234
start_timeout_ms = 30000
request_timeout_ms = 180000

# Medium English provides a capacity-matched Whisper comparison for Parakeet.
# It keeps every execution control identical to the Base English run.
[backends.crisp_v0823_whisper_medium_en_q4k]
type = "crispasr_server"
bin = "models/crispasr-v0.8.23/runtime/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "models/whisper-medium.en-GGML/ggml-medium.en-q4_k.bin"
backend = "whisper"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_k"
no_punctuation = false       # Match the Base run's native Whisper output path.
runtime_version = "0.8.23"
runtime_git_sha = "7d22deec"
host = "127.0.0.1"
port = 51234
start_timeout_ms = 30000
request_timeout_ms = 180000

[backends.crisp_v0823_parakeet_q4k]
type = "crispasr_server"
bin = "models/crispasr-v0.8.23/runtime/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "../voicerefine-desktop/resources/models/parakeet-tdt-0.6b-v3-GGUF/parakeet-tdt-0.6b-v3-q4_k.gguf"
backend = "parakeet"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_k"
no_punctuation = false
runtime_version = "0.8.23"
runtime_git_sha = "7d22deec"
host = "127.0.0.1"
port = 51234
start_timeout_ms = 30000
request_timeout_ms = 180000

[backends.crisp_v0823_cohere_q4k]
type = "crispasr_server"
bin = "models/crispasr-v0.8.23/runtime/crispasr-windows-x86_64-cpu/crispasr.exe"
model = "../voicerefine-desktop/resources/models/cohere-transcribe-03-2026-GGUF/cohere-transcribe-q4_k.gguf"
backend = "cohere"
language = "en"
threads = 8
gpu_backend = "cpu"
quantization = "q4_k"
no_punctuation = true        # Disable Cohere's optional punctuation restorer.
runtime_version = "0.8.23"
runtime_git_sha = "7d22deec"
host = "127.0.0.1"
port = 51234
start_timeout_ms = 30000
request_timeout_ms = 180000

# --- Cloud reference --------------------------------------------------------
[backends.elevenlabs_scribe_v2]
type = "elevenlabs"
model_id = "scribe_v2"       # verify against ElevenLabs' current model ids
language_code = "eng"
diarize = false
tag_audio_events = false
# API key comes from env ELEVENLABS_API_KEY (never stored in this file).
base_url = "https://api.elevenlabs.io/v1/speech-to-text"
max_retries = 5
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
request_timeout_seconds = 300

[backends.sarvam_saaras_v4]
type = "sarvam"
model = "saaras:v4"
language_code = "en-IN"
# API key comes from env SARVAM_API_KEY (never stored in this file).
base_url = "https://api.sarvam.ai/speech-to-text"
max_retries = 5
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
request_timeout_seconds = 300

[backends.smallest_pulse_pro]
type = "smallest"
model = "pulse-pro"
language = "en"
base_url = "https://api.smallest.ai/waves/v1/stt/"
# Batch-only pacing stays outside the timed API-call boundary. It prevents this
# personal-project evaluation from exceeding the workspace's sustained limit.
min_request_interval_seconds = 4.0
max_retries = 5
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
request_timeout_seconds = 300

[backends.smallest_pulse]
type = "smallest"
model = "pulse"
language = "en"
base_url = "https://api.smallest.ai/waves/v1/stt/"
# Keep the same pacing and timed request boundary as the Pulse Pro evaluation.
min_request_interval_seconds = 4.0
max_retries = 5
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
request_timeout_seconds = 300
